name: CPU-Budget Frontier
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cpu-frontier.yml
      - experiments/cpu_budget_frontier.py
      - src/sil/certificate_sprint.py
      - src/sil/query_lab.py
jobs:
  calibrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_certificate_planner.py tests/test_query_lab.py
      - name: Separate calibration and holdout for equal-CPU comparison
        run: python experiments/cpu_budget_frontier.py --calibration 8 --holdout 12 --maximum 128 --budget 576 --repeats 3 --output cpu-frontier.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-budget-raw
          path: cpu-frontier.json
