name: SIL CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,ui]'
      - run: python -m compileall -q src app.py
      - run: python -m pytest -q
      - run: python experiments/query_budget_benchmark.py --seeds 6 --budget 288 --maximum 64 --output /tmp/sil-query-lab.json
      - run: sil query-lab --scenario 2 --trials 64 --budget 288 --method hybrid --output /tmp/sil-query-cli.json
      - run: sil query-lab --scenario 2 --trials 64 --budget 288 --method evsi_reward --output /tmp/sil-evsi-cli.json
      - run: python experiments/evsi_reward_benchmark.py --seeds 2 --maximum 64 --budget 288 --output /tmp/sil-evsi-benchmark.json
      - run: sil run --rounds 2 --trials 32 --output /tmp/sil-audit.json
      - run: sil run --rounds 2 --trials 32 --allocation adaptive --budget 288 --output /tmp/sil-adaptive-audit.json
      - run: python experiments/aca_benchmark.py --seeds 2 --trials 32 --holdout 64 --output /tmp/sil-aca-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: sil-exploratory-${{ matrix.python-version }}
          path: |
            /tmp/sil-adaptive-audit.json
            /tmp/sil-aca-benchmark.json

