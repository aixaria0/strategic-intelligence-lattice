[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-intelligence-lattice"
version = "0.7.0"
description = "Reproducible human-controlled synthetic strategic simulation research lab"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
ui = ["streamlit>=1.33,<2", "plotly>=5.18,<7"]
test = ["pytest>=7.4,<10"]

[project.scripts]
sil = "sil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
